name: leaderboard

on:
  pull_request:
    paths:
      - "scripts/publish_arena_evaluation.py"
      - "scripts/test_publish_arena_evaluation.py"
      - "deploy/leaderboard/**"
      - ".github/workflows/leaderboard.yml"
  push:
    branches: [main]
    paths:
      - "scripts/publish_arena_evaluation.py"
      - "scripts/test_publish_arena_evaluation.py"
      - "deploy/leaderboard/**"
      - ".github/workflows/leaderboard.yml"

permissions:
  contents: read

jobs:
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/test_publish_arena_evaluation.py
      - run: python3 -m py_compile deploy/leaderboard/apply_backend.py scripts/publish_arena_evaluation.py
